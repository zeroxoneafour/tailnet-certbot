[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
getrandom = "0.4.3"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
serde = { version = "1.0.229", features = ["derive"] }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
toml = "1.1.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
