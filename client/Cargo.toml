[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = { version = "3.5.1", default-features = false, features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
